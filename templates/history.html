<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction History</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}" />
  </head>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    /* This aligns headers and data cells to the exact same starting point */
    th,
    td {
      padding: 12px;
      text-align: left; /* Aligns all text neatly to the left */
      border-bottom: 1px solid #ddd;
      font-family:
        "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
    }
    th {
      font-family:
        "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      font-weight: bold;
    }
  </style>
  <body>
    <div class="historyHead">
      <h2>Finalyze</h2>
      <h4>Know your Money -</h4>
      <h4>Analyze Smart -</h4>
      <h4>Spend Smart</h4>
    </div>
    <div class="transactionHeading">
      <div id="historyID">
        <h3>Transaction History</h3>
      </div>
    </div>
    <div class="historyTable">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Description</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
          <tr>
            <td>{{row['id']}}</td>
            <td>{{row['amount']}}</td>
            <td>{{row['type']}}</td>
            <td>{{row['description']}}</td>
            <td>{{row['date']}}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
